OpenAI:
  api_key: 'API_KEY'
  base_url: 'https://api.openai.com/v1'
# gpt-5.6-luna is the cost-efficient GPT-5.6 option for general responses.
# Use gpt-5.6-terra for a balance of intelligence and cost, or gpt-5.6 for
# flagship capability. Arbitrary model IDs remain supported for compatible APIs.
# See https://developers.openai.com/api/docs/models
  ai_model: gpt-5.6-luna
# Local model file to use for transcription.
# Can also be specified using the -m parameter on command line of the application
  local_transcripton_model_file: 'base'
# Language in which ChatGPT should respond.
# List of languages available for openAI is available at
# https://platform.openai.com/docs/guides/speech-to-text/supported-languages
  response_lang: English
# Interpret the audio from speakers, mic to be in this language
  audio_lang: English

# Model for the OpenAI speech to text API (used with use_api: True).
# whisper-1 returns segment timestamps, which keep live requests short.
  stt_model: whisper-1

# Request timeout for any response requests made to openAI API
  response_request_timeout_seconds: 20

# Summarize request timeout for any response requests made to openAI API
  summarize_request_timeout_seconds: 30

# Optional Chat Completions parameters. Leave null when a model or compatible
# provider does not support the parameter.
  temperature: null
  reasoning_effort: null  # none, minimal, low, medium, high, xhigh, or max

Deepgram:
  api_key: 'API_KEY'
  # Nova-3 is Deepgram's current high-accuracy general transcription model.
  # It is the default for this app's chunked/pre-recorded Deepgram path.
  model: 'nova-3'

OpenAIRealtime:
  # Streaming STT model; the API key is reused from OpenAI.api_key.
  model: 'gpt-live-transcribe'
  input_sample_rate: 24000
  # Manual turn detection commits audio in bounded windows so finalized
  # transcript rows arrive predictably. Set to server_vad for silence-based turns.
  turn_detection: null
  manual_commit_interval_seconds: 3
  delay: 'low'
  capture_chunk_duration_ms: 100
  vad_threshold: 0.5
  vad_prefix_padding_ms: 300
  vad_silence_duration_ms: 500
  reconnect_attempts: 3
  reconnect_backoff_seconds: 2
  # At the default 100 ms streaming cadence this buffers about 12 seconds.
  # Overflow is reported rather than silently discarded.
  max_buffered_chunks: 120
  # Shared capture ingress; overflow replaces the oldest block to keep latency bounded.
  max_raw_audio_chunks: 240
  event_queue_size: 500
  deduplication_cache_size: 2048

Together:
  api_key: 'API_KEY'
  # Supported models are at https://docs.together.ai/docs/inference-models
  ai_model: 'mistralai/Mixtral-8x7B-Instruct-v0.1'
  base_url: 'https://api.together.xyz'

WhisperCpp:
  # Can also be specified using the -m parameter on command line of the application
  local_transcripton_model_file: 'base'

SenseVoice:
  # Experimental Windows-only backend. Run setup-sensevoice.bat first.
  model: 'FunAudioLLM/SenseVoiceSmall'
  device: 'auto'  # auto, cpu, or cuda:0
  use_itn: True

General:
  log_file: 'logs/Transcribe.log'
  # These two parameters are used together.
  # Save LLM response to file if save_llm_response_to_file is Yes
  save_llm_response_to_file: Yes # Possible values are Yes, No
  llm_response_file: 'logs/response.txt'
# Attempt transcription of the sound file after these number of seconds
  transcript_audio_duration_seconds: 3
# Maximum rolling audio window retained for live transcription.
  live_transcription_window_seconds: 30
# Text newer than this remains mutable so later overlapping windows can correct it.
  live_transcription_mutable_tail_seconds: 5
# Audio context retained after stable text is committed.
  live_transcription_audio_context_seconds: 10
# Number of repeated hypotheses before text is considered stable.
  live_transcription_stability_passes: 2
# Once the audio of one row passes this many seconds, text that is no longer changing is
# committed and its audio leaves the buffer, so each speech to text request stays short.
# 0 turns committing off (the buffer then grows up to live_transcription_window_seconds).
  live_transcription_commit_seconds: 10
# Local speech to text engine for stt: whisper without the API.
# auto = faster-whisper (installed by setup.bat; fast on CPU, no PyTorch needed).
# openai-whisper is optional (needs PyTorch, several GB): run app\transcribe\setup-openai-whisper.bat.
# Possible values: auto, faster-whisper, openai-whisper
  local_engine: auto
# These two parameters are used together.
# Setting clear_transcript_periodically: yes will clear transcript data at a regular interval
# clear_transcript_interval_seconds is applicable when clear_transcript_periodically is set to Yes
  clear_transcript_periodically: No # Possible values are Yes, No
  clear_transcript_interval_seconds: 90
# Determines whether to use API for STT or not. This option is applicable only for online services.
# This option has no affect on offline services.
# This is equivalent to -stt (speech_to_text) argument on command line.
# Command line argument takes precedence over value specified in parameters.yaml
  use_api: False
# Index of microphone device. Value of -1 indicates it is not set.
# This is equivalent to -mi (mic_device_index) argument on command line
# Command line argument takes precedence over value specified in parameters.yaml
  mic_device_index: -1
# Index of speaker device.  Value of -1 indicates it is not set.
# This is equivalent to -si (speaker_device_index) argument on command line
# Command line argument takes precedence over value specified in parameters.yaml
  speaker_device_index: -1
# Disable Microphone
# This is equivalent to -dm (disable_mic) argument on command line
# Command line argument takes precedence over value specified in parameters.yaml
  disable_mic: False
# This is equivalent to -ds (disable_speaker) argument on command line
# Command line argument takes precedence over value specified in parameters.yaml
  disable_speaker: False
  stt: whisper
  continuous_response: True
  # Minimum number of seconds between two automatic LLM responses.
  # A response is requested as soon as the transcript changes, never sooner than this.
  llm_response_interval: 5

# This is equivalent to -c argument on command line
# Command line argument takes precedence over value specified in parameters.yaml
  chat_inference_provider: openai


# Used around the text when a reply is asked for text selected in the transcript
# (More > Reply to the selected text). Both can be empty.
  default_prompt_preamble: "Reply to this part of the conversation:"
  default_prompt_epilogue: ""
# What the assistant is told to do. It can be changed in the program: Settings > Assistant,
# which also offers other ready-made roles (job interview, explaining, casual conversation).
  system_prompt: "You are my real-time assistant during a live conversation (a meeting, a call or an interview). You receive a rough automatic transcript: lines marked 'Me' are what I said, lines marked 'Other' are what the other people said. It can contain recognition mistakes; work out what was meant. Give me what I should say next, or the answer to the latest question from the others. Be correct and specific, and short enough to read at a glance: a few sentences or short bullet points. Never ask me to repeat or clarify, and do not describe or summarize the transcript."

  summary_prompt: 'Summarize this conversation: the main points, any decisions, and what each side still has to do.'

# Optional: text the conversation starts with, before anything is said (for example who you
# are and what the meeting is about). Usually it is simpler to add that to system_prompt.
#   initial_convo:
#     first:
#       role: "You"
#       content: "I am V, a backend developer, in an interview for a senior position."
#     second:
#       role: "assistant"
#       content: "Understood."
  initial_convo: {}

# Keep a sound recording (logs/mic.wav, logs/speaker.wav) of each session. Large files.
  save_audio_log: No
# Optional proxy for the AI provider and model downloads, e.g. http://127.0.0.1:8080
# Empty: the Windows proxy settings are used.
  proxy: ''
# Window: text size of the transcript and the reply, stay above other windows, last size.
  ui_font_size: 14
  always_on_top: No
  window_geometry: ''
